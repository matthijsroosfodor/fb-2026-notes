@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}

 v:["Bent u fabrikant of merk?","Spot cleaner: gescheiden tanks schoon/vuil?","Steelstofzuiger: hoogste kPa en accuduur","Prijs op 500/1.000/3.000 en MOQ"]},
{d:"reserve",t:"",st:"10.1-123",n:"DEWE",
 ctx:"Robots + kledingstomer + hair styler. Nora Chen, Leo Liu, Sophia Rao. Airstyler = €3,16M/jr; MAE haalt €568k met één model van €134,60.",
 fob:"",
 v:["RAAMWASROBOT \u2014 prijs, MOQ, afstandsbediening. Enige fabrikant op de lijst voor deze categorie (MEDEK MDLV0126)","Airstyler 5-in-1 en 8-in-1: prijs, MOQ, opzetstukken","Diffuser standaard erbij?","Kledingstomer hand en staand","Verkoopt u zelf onder eigen merk in de EU?"]},
{d:"reserve",t:"",st:"1.2-200",n:"HUAYU",
 ctx:"1996, Ningbo, 2.500 man, 80 R&D-ingenieurs. Tosti, contactgrills, airfryers, stoomstrijkijzers, kledingstomers. Contactgrill = €3,98M/jr; Safecourt haalt €501k met twee modellen van €87.",
 fob:"",
 v:["Contactgrill met uitneembare platen — prijs en MOQ","Vaatwasserbestendig? Dat is het koopargument op €87","Kledingstomer hand en staand","Verkoopt HUAYU zelf in de EU?"]},
{d:"na",t:"",st:"n.v.t.",n:"MEDEK France \u2014 n\u00e1 de beurs",
 ctx:"STAAT NIET OP IFA (gecontroleerd). Franse groothandel, \u20ac3,86M, NUL werknemers \u2014 geen fabrikant. 21 van hun 83 producten komen door onze meetlat. Leg hun prijs naast de FOB s die je hier ophaalt. Magnetron \u20ac4,22M is de enige regel waar niemand op de beurs staat.",
 fob:"",
 v:["Prijs op de 7 eerste-keusproducten: 100 / 500 / 1.000 stuks","MOQ, gemengd per container mogelijk?","Technisch dossier + CE-verklaring mee \u2014 kunnen WIJ als fabrikant op het typeplaatje?","kPa, watt, looptijd per stofzuiger \u2014 op vol vermogen","PAS HIERNA: bij welke fabrieken zitten deze modellen, en kunnen we volume bundelen?","Verkopen jullie in NL of BE, en via welke kanalen?"]},
];
const KEY='fodor_ifa2026_v1';
let D=JSON.parse(localStorage.getItem(KEY)||'{}');
let filter='alle';

function save(){try{localStorage.setItem(KEY,JSON.stringify(D));toast()}catch(e){alert('Opslag vol. Download het rapport en verwijder een paar foto\'s.')}meter()}
let tt;function toast(){const s=document.getElementById('saved');s.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>s.classList.remove('on'),900)}
function meter(){const b=new Blob([JSON.stringify(D)]).size;const f=Object.values(D).reduce((a,x)=>a+((x.fotos||[]).length),0);
 const tot=SUP.length+Object.keys(D).filter(k=>D[k].eigen).length;
 const bezig=Object.keys(D).filter(k=>status(k)).length, klaar=Object.keys(D).filter(k=>status(k)==='klaar').length;
 document.getElementById('meter').textContent=`${klaar} afgerond \u00b7 ${bezig-klaar} bezig \u00b7 ${tot-bezig} nog te doen \u00b7 ${f} foto's \u00b7 ${(b/1048576).toFixed(1)} MB`}
function g(st){return D[st]||(D[st]={})}
function set(st,k,v){g(st)[k]=v;save()}
function status(st){const d=D[st];if(!d)return'';if(d.vervolg)return'klaar';if(d.contact||d.eigenmerk||(d.prijs&&d.prijs.some(r=>r.some(c=>c))))return'bezig';return''}

function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
 const groepen=['alle','ZO','MA-ocht','MA-mid','reserve','na','eigen'];
 document.getElementById('filters').innerHTML=groepen.map(x=>
  `<div class="chip ${filter===x?'on':''}" onclick="filter='${x}';render()">${
   {alle:'Alles',ZO:'Zondag',['MA-ocht']:'Ma ochtend',['MA-mid']:'Ma middag',reserve:'Reserve',na:'N\u00e1 de beurs',eigen:'Zelf toegevoegd'}[x]}</div>`).join('');
 const eig=Object.keys(D).filter(k=>D[k].eigen).map(k=>({d:'eigen',t:'',st:k,n:D[k].naam||'(nieuwe stand)',ctx:'',fob:'',v:['','','','']}));
 const lijst=[...SUP,...eig].filter(s=>filter==='alle'||s.d===filter);
 document.getElementById('lijst').innerHTML=lijst.map(kaart).join('');
 meter();
}

function kaart(s){
 const d=g(s.st), stt=status(s.st);
 const pr=d.prijs||[['','','',''],['','','',''],['','','',''],['','','','']];
 return `<div class="card ${d.open?'open':''}" id="c-${s.st}">
 <div class="chd" onclick="toggle('${s.st}')">
   <div class="dot ${stt}"></div>
   <div class="st">${s.st}</div>
   <div class="nm">${esc(s.n)}</div>
   <div class="tm">${s.t||''}</div>
 </div>
 <div class="body">
  ${s.ctx?`<div class="ctx">${s.ctx}</div>`:''}
  ${s.fob?`<div class="fob"><b>MAX FOB \u2014 niet noemen:</b> ${s.fob}</div>`:`<div class="fob">Max-FOB staat <b>niet</b> in deze webversie. Kijk op de papieren kaart achterin de beursmap.</div>`}
  ${d.eigen?`<label>Bedrijfsnaam</label><input type="text" value="${esc(d.naam)}" oninput="set('${s.st}','naam',this.value);document.querySelector('#c-${s.st} .nm').textContent=this.value">
  <label>Wat maken ze</label><textarea oninput="set('${s.st}','watmaken',this.value)">${esc(d.watmaken)}</textarea>`:''}
  <label>Gesproken met — naam, functie, mail, WeChat</label>
  <textarea oninput="set('${s.st}','contact',this.value)">${esc(d.contact)}</textarea>
  <label style="color:#c0392b">Verkoopt u zelf onder eigen merk in Europa? Welke landen en kanalen?</label>
  <textarea oninput="set('${s.st}','eigenmerk',this.value)">${esc(d.eigenmerk)}</textarea>
  <div class="g3">
   <div><label>MOQ</label><input type="text" value="${esc(d.moq)}" oninput="set('${s.st}','moq',this.value)"></div>
   <div><label>Levertijd monster</label><input type="text" value="${esc(d.ltm)}" oninput="set('${s.st}','ltm',this.value)"></div>
   <div><label>Levertijd serie</label><input type="text" value="${esc(d.lts)}" oninput="set('${s.st}','lts',this.value)"></div>
  </div>
  <label>FOB-prijs op drie volumes</label>
  <table class="pr"><tr><th>Model</th><th>500</th><th>1.000</th><th>3.000</th><th>st/40HQ</th></tr>
  ${pr.map((r,i)=>`<tr>${r.map((c,j)=>`<td><input type="text" value="${esc(c)}" oninput="prijs('${s.st}',${i},${j},this.value)"></td>`).join('')}<td><input type="text" value="${esc((d.hq||[])[i])}" oninput="hq('${s.st}',${i},this.value)"></td></tr>`).join('')}
  </table>
  <div class="g2">
   <div><label>Certificering</label><input type="text" value="${esc(d.cert)}" oninput="set('${s.st}','cert',this.value)">
        <label>Wij als fabrikant op typeplaatje?</label><input type="text" value="${esc(d.plaat)}" oninput="set('${s.st}','plaat',this.value)"></div>
   <div><label>Betaalvoorwaarden</label><input type="text" value="${esc(d.betaal)}" oninput="set('${s.st}','betaal',this.value)">
        <label>Exclusiviteit — landen / kanalen / duur</label><input type="text" value="${esc(d.excl)}" oninput="set('${s.st}','excl',this.value)"></div>
  </div>
  ${s.v.filter(x=>x).length?`<label>Onze vragen bij deze stand</label>${s.v.filter(x=>x).map((q,i)=>
    `<div class="vraag"><div class="bx ${(d.gedaan||[])[i]?'on':''}" onclick="vink('${s.st}',${i},this)">${(d.gedaan||[])[i]?'✓':''}</div><div>${q}</div></div>
     <textarea style="min-height:44px" oninput="antw('${s.st}',${i},this.value)">${esc((d.antw||[])[i])}</textarea>`).join('')}`:''}
  <label>Foto's van het product — tik op het camera-vak</label>
  <div class="fotos">
   ${(d.fotos||[]).map((f,i)=>`<div class="fw"><img src="${f}"><button onclick="delFoto('${s.st}',${i})">×</button></div>`).join('')}
   <label class="camera">＋<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="addFoto('${s.st}',this)"></label>
  </div>
  <label>Overig / opvallend</label>
  <textarea oninput="set('${s.st}','overig',this.value)">${esc(d.overig)}</textarea>
  <div class="scores">
   ${[['s_product','product'],['s_prijs','prijs'],['s_vertrouwen','vertrouwen']].map(([k,lab])=>`<div class="sc"><label>${lab}</label><div class="stars">
     ${[1,2,3,4,5].map(n=>`<span class="${(d[k]||0)>=n?'on':''}" onclick="score('${s.st}','${k}',${n})">${n}</span>`).join('')}
   </div></div>`).join('')}
  </div>
  <label>Vervolg</label>
  <div class="vervolg">
   <button class="${d.vervolg==='monster'?'on':''}" onclick="verv('${s.st}','monster')">Monster</button>
   <button class="${d.vervolg==='prijs'?'on':''}" onclick="verv('${s.st}','prijs')">Prijs opvragen</button>
   <button class="nee ${d.vervolg==='nee'?'on':''}" onclick="verv('${s.st}','nee')">Nee</button>
  </div>
 </div></div>`;
}

function toggle(st){g(st).open=!g(st).open;save();document.getElementById('c-'+st).classList.toggle('open')}
function prijs(st,i,j,v){const d=g(st);d.prijs=d.prijs||[['','','',''],['','','',''],['','','',''],['','','','']];d.prijs[i][j]=v;save()}
function hq(st,i,v){const d=g(st);d.hq=d.hq||[];d.hq[i]=v;save()}
function vink(st,i,el){const d=g(st);d.gedaan=d.gedaan||[];d.gedaan[i]=!d.gedaan[i];el.classList.toggle('on');el.textContent=d.gedaan[i]?'✓':'';save()}
function antw(st,i,v){const d=g(st);d.antw=d.antw||[];d.antw[i]=v;save()}
function score(st,k,n){g(st)[k]=n;save();render()}
function verv(st,v){g(st).vervolg=g(st).vervolg===v?'':v;save();render()}
function nieuw(){const st='eigen-'+Date.now().toString().slice(-5);D[st]={eigen:true,naam:'',open:true};save();filter='eigen';render();
 setTimeout(()=>document.getElementById('c-'+st).scrollIntoView({behavior:'smooth'}),80)}

function addFoto(st,inp){
 const d=g(st);d.fotos=d.fotos||[];let n=inp.files.length;
 [...inp.files].forEach(f=>{
  const r=new FileReader();
  r.onload=e=>{const im=new Image();im.onload=()=>{
    const max=1000,sc=Math.min(1,max/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=im.width*sc;cv.height=im.height*sc;
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    d.fotos.push(cv.toDataURL('image/jpeg',.55));
    if(--n===0){save();render();document.getElementById('c-'+st).classList.add('open')}
  };im.src=e.target.result};
  r.readAsDataURL(f);
 });inp.value=''}
function delFoto(st,i){if(!confirm('Foto verwijderen?'))return;g(st).fotos.splice(i,1);save();render()}

function alleRijen(){
 const eig=Object.keys(D).filter(k=>D[k].eigen).map(k=>({d:'eigen',t:'',st:k,n:D[k].naam||'(nieuw)',ctx:'',fob:'',v:[]}));
 return [...SUP,...eig].filter(s=>D[s.st]&&Object.keys(D[s.st]).some(k=>k!=='open'));
}
function exportCSV(){
 const H=['Dag','Tijd','Stand','Leverancier','Contact','Eigen merk EU','MOQ','Levertijd monster','Levertijd serie','Prijzen','st/40HQ','Certificering','Typeplaatje','Betaling','Exclusiviteit','Antwoorden','Overig','Product','Prijs','Vertrouwen','Vervolg','Foto s'];
 const rows=alleRijen().map(s=>{const d=D[s.st];return [s.d,s.t,s.st,d.naam||s.n,d.contact,d.eigenmerk,d.moq,d.ltm,d.lts,
  (d.prijs||[]).filter(r=>r.some(c=>c)).map(r=>r.join(' / ')).join(' | '),(d.hq||[]).filter(x=>x).join(' | '),
  d.cert,d.plaat,d.betaal,d.excl,(d.antw||[]).filter(x=>x).join(' | '),d.overig,d.s_product,d.s_prijs,d.s_vertrouwen,d.vervolg,(d.fotos||[]).length]
  .map(x=>'"'+String(x==null?'':x).replace(/"/g,'""').replace(/\n/g,' ')+'"').join(',')});
 dl('IFA2026_beursvangst.csv','text/csv;charset=utf-8','﻿'+H.join(',')+'\n'+rows.join('\n'));closeMenu()}
function exportHTML(){
 const R=alleRijen();
 const h=`<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>IFA 2026 beursvangst — Fodor</title>
<style>body{font:14px -apple-system,Segoe UI,Helvetica,Arial;max-width:900px;margin:0 auto;padding:24px;color:#111}

${R.map(s=>{const d=D[s.st];const rij=(k,v)=>v?`<tr><th>${k}</th><td>${esc(String(v)).replace(/\n/g,'<br>')}</td></tr>`:'';
 return `<h2>${s.st} · ${esc(d.naam||s.n)} ${d.vervolg?`<span class="tag ${d.vervolg}">${d.vervolg}</span>`:''}</h2>
 <table>${rij('Dag / tijd',[s.d,s.t].filter(x=>x).join(' '))}${rij('Gesproken met',d.contact)}${rij('Eigen merk in EU',d.eigenmerk)}
 ${rij('MOQ',d.moq)}${rij('Levertijd monster',d.ltm)}${rij('Levertijd serie',d.lts)}
 ${(d.prijs||[]).some(r=>r.some(c=>c))?`<tr><th>FOB-prijzen</th><td><table><tr><th>Model</th><th>500</th><th>1.000</th><th>3.000</th><th>st/40HQ</th></tr>${d.prijs.filter(r=>r.some(c=>c)).map((r,i)=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}<td>${esc((d.hq||[])[i])}</td></tr>`).join('')}</table></td></tr>`:''}
 ${rij('Certificering',d.cert)}${rij('Typeplaatje',d.plaat)}${rij('Betaling',d.betaal)}${rij('Exclusiviteit',d.excl)}
 ${(d.antw||[]).some(x=>x)?`<tr><th>Antwoorden op onze vragen</th><td>${s.v.filter(x=>x).map((q,i)=>(d.antw||[])[i]?`<b>${esc(q)}</b><br>${esc(d.antw[i])}<br><br>`:'').join('')}</td></tr>`:''}
 ${rij('Overig',d.overig)}${rij('Score',[d.s_product&&'product '+d.s_product,d.s_prijs&&'prijs '+d.s_prijs,d.s_vertrouwen&&'vertrouwen '+d.s_vertrouwen].filter(x=>x).join(' · '))}</table>
 ${(d.fotos||[]).length?`<div class="im">${d.fotos.map(f=>`<img src="${f}">`).join('')}</div>`:''}`}).join('')}
</body></html>`;
 dl('IFA2026_beursvangst.html','text/html;charset=utf-8',h);closeMenu()}
function backupJSON(){dl('IFA2026_backup_'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(D));closeMenu()}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{D=JSON.parse(e.target.result);save();render();closeMenu();alert('Back-up teruggezet.')}catch(x){alert('Kon het bestand niet lezen.')}};r.readAsText(f)}
function dl(naam,type,inhoud){const b=new Blob([inhoud],{type});const u=URL.createObjectURL(b);
 const a=document.createElement('a');a.href=u;a.download=naam;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400)}
function openMenu(){document.getElementById('menu').classList.add('on')}
function closeMenu(){document.getElementById('menu').classList.remove('on')}
document.getElementById('menu').addEventListener('click',e=>{if(e.target.id==='menu')closeMenu()});
render();
</script>
